<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Become a Driver | Ride Right</title>
    <link rel="stylesheet" href="driver.css">
</head>
<body>

<header>
    <h2>Ride Right Driver Registration</h2>
</header>

<div class="container">
    <form id="driverForm">
        <h2>Become a Driver</h2>

        <input type="text" id="name" placeholder="Full Name" required>
        <input type="email" id="email" placeholder="Email Address" required>
        <input type="password" id="password" placeholder="Password" required>
        <input type="tel" id="phone" placeholder="Phone Number" required>
        <input type="text" id="vehicle" placeholder="Vehicle Model" required>
        <input type="text" id="plateNumber" placeholder="Plate Number" required>

        <select id="vehicleType" required>
            <option value="">Select Vehicle Type</option>
            <option value="Economy">Economy</option>
            <option value="Comfort">Comfort</option>
            <option value="SUV">SUV</option>
            <option value="Luxury">Luxury</option>
        </select>

        <button type="submit">Register Driver</button>

         <p>
            Already registered?
            <a href="driver-login.html">Sign in</a>
        </p>


    </form>

</div>

<script src="driver.js"></script>

</body>
</html>
