<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Driver Login | Ride Right</title>

    <link rel="stylesheet" href="driver-login.css">
</head>
<body>

<div class="login-container">

    <form id="driverLoginForm">

        <h2>Driver Login</h2>

        <input
            type="email"
            id="email"
            placeholder="Email Address"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
            required
        >

        <button type="submit">
            Login
        </button>

        <p>
            Not registered?
            <a href="driver.html">Register as a Driver</a>
        </p>

    </form>

</div>

<script src="driver-login.js"></script>

</body>
</html>
