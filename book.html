<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book a Ride - Ride Right</title>
    <link rel="stylesheet" href="book.css">
</head>
<body>

<header>
    <h2>Ride Right</h2>
</header>

<div class="container">

    <form id="rideForm">

        <h2>Book Your Ride</h2>

        <input type="text" id="pickup" placeholder="Pickup Location" required>

        <input type="text" id="destination" placeholder="Destination" required>

        <select id="rideType">
            <option value="Economy">Economy</option>
            <option value="Comfort">Comfort</option>
            <option value="SUV">SUV</option>
            <option value="Luxury">Luxury</option>
        </select>

        <input type="date" id="rideDate" required>

        <input type="time" id="rideTime" required>

        <section class="fare-section">
            <div class="fare-card">
                <h2>Fare Estimator</h2>
                <p>Estimate the cost of your ride.</p>
                
                <input type="number" id="distance" placeholder="Distance (KM)" min="1">
                
                <select id="rideType">
                    <option value="Economy">Economy</option>
                    <option value="Comfort">Comfort</option>
                    <option value="SUV">SUV</option>
                    <option value="Luxury">Luxury</option>
                </select>
                
                <button id="estimateBtn">Estimate Fare</button>
                
                <div class="result">
                    <h3 id="fare">₦ 0</h3>
                </div>
            </div>
        </section>

        <button type="submit">Book Ride</button>

    </form>

</div>

<script src="book.js"></script>

</body>
</html>
